        /* Glassmorphism utility classes */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
        /* CARD NAVIGATION TRANSITIONS */
        .slide-in {
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .slide-out {
            animation: slideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slideOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.98); }
        }
        /* Smooth inputs accent */
        .input-accent:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
        }
    </style>

    <!-- Main Dynamic Card Area -->
    <main class="w-full max-w-xl mx-auto flex-grow flex items-center justify-center py-4">
        <form id="surveyForm" onsubmit="event.preventDefault();" class="w-full">
            
            <!-- Global Card Container with responsive sizes -->
            <div id="cardContainer" class="glass-card rounded-3xl p-6 md:p-8 transition-all duration-300 min-h-[420px] flex flex-col justify-between relative overflow-hidden">
                
                <!-- TOP HEADER INSIDE CARD -->
                <div>
                    <!-- Section Badge Indicator -->
                    <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-3">
                        <span id="sectionBadge" class="px-3 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded-capitalize each word">
                            Informasi Data Diri
                        </span>
                        <span id="stepProgressText" class="text-xs font-bold text-slate-400 capitalize each word">
                            Halaman 1 dari 13
                        </span>
                    </div>
                    <!-- Progress Indicator Bar -->
                    <div class="w-full bg-slate-100 rounded-full h-1.5 mb-6 overflow-hidden">
                        <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-1.5 rounded-full transition-all duration-500" style="width: 7%"></div>
                    </div>
                    <!-- ACTIVE CARD VIEW (Dynamically Populated) -->
                    <div id="cardContent" class="slide-in min-h-[220px]">
                        <!-- Content injected by JavaScript -->
                    </div>
                </div>
                <!-- BOTTOM NAVIGATION BUTTONS -->
                <div class="flex items-center justify-between mt-8 pt-4 border-t border-slate-100">
                    <button type="button" id="prevBtn" onclick="handlePrev()" class="px-5 py-3 text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-xl transition-all duration-200 flex items-center gap-2 border border-transparent hover:border-slate-200 disabled:opacity-0 disabled:pointer-events-none">
                        <i class="fa-solid fa-arrow-left"></i> Kembali
                    </button>
                    
                    <button type="button" id="nextBtn" onclick="handleNext()" class="px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-bold text-sm rounded-xl shadow-md hover:shadow-indigo-500/20 active:scale-95 transition-all duration-200 flex items-center gap-2 ml-auto">
                        Lanjut <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </form>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx80ov1g-Ixog-7RqBDDlrKvRJGT75ZAYP7h1Uh4Wu29vrbutMfba2SJncY7jp66ZRLYA/exec";
        const steps = {
            WELCOME: 0,
            SEC1_Q1: 1,
            SEC1_Q2: 2,
            SEC1_Q3: 3,
            SEC1_Q4: 4,
            SEC1_Q5: 5,
            SEC2_Q1: 6,
            SEC2_Q2: 7,
            SEC2_Q3: 8,
            SEC2_Q4: 9,
            SEC2_Q5: 10,
            SEC2_Q6: 11,
            CONFIRM: 12,
            SUCCESS: 13
        };
        const totalStepsCount = 13; // Excluding SUCCESS screen
        let currentStep = steps.WELCOME;
        // Data Storage object
        const formData = {
            nama: '',
            asal_sekolah: '',
            kelas: '',
            sec1_q1: '',
            sec1_q2: '',
            sec1_q3: '',
            sec1_q4: '',
            sec1_q5: '',
            sec2_q1: '',
            sec2_q2: '',
            sec2_q3: '',
            sec2_q4: '',
            sec2_q5: '',
            sec2_q6: ''
        };
        // Master Render Function to swap cards dynamically
        function renderCard() {
            const container = document.getElementById('cardContent');
            const badge = document.getElementById('sectionBadge');
            const progressText = document.getElementById('stepProgressText');
            const progressBar = document.getElementById('progressBar');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            // Apply exit animation, change content, apply enter animation
            container.classList.remove('slide-in');
            container.classList.add('slide-out');
            setTimeout(() => {
                let html = '';
                
                // Track visual layout states depending on current step
                if (currentStep === steps.WELCOME) {
                    badge.innerText = "Halaman Pembuka";
                    badge.className = "px-3 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded-capitalize each word";
                    progressText.innerText = `Langkah 1 dari ${totalStepsCount}`;
                    progressBar.style.width = "7%";
                    prevBtn.disabled = true;
                    nextBtn.innerHTML = `Mulai Survei <i class="fa-solid fa-play"></i>`;
                    
                    html = `
                        <div class="space-y-4">
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800 leading-tight">
                                Selamat Datang di Survei Al-Kahfi

                                    <p class="font-bold text-amber-700 mt-0.5">Rp ${formatToIDR(formData.sec2_q4)}</p>
                                    <p class="italic text-slate-500 mt-1.5">“Tertarik kompilasi buku?”</p>
                                    <p class="font-medium text-slate-800 mt-0.5">${formData.sec2_q5}</p>
                                    <p class="italic text-slate-500 mt-1.5">“Harga ekspektasi buku”</p>
                                    <p class="font-bold text-amber-700 mt-0.5">Rp ${formatToIDR(formData.sec2_q6)}</p>
                                </div>
                            </div>
                        </div>
                       <div class="w-full text-center text-xs text-blue-600/60 mt-4 z-10 flex flex-col gap-3">
                        <i class="fa-solid fa-info-circle text-blue-600"></i>
                        <p>Dengan mengirim tanggapan ini berarti kamu menyetujui pemrosesan data pribadi oleh Yayasan Al-Kahfi sesuai dengan undang-undang pelindungan data pribadi</p>
                       </div>
                    `;
                } 
                else if (currentStep === steps.SUCCESS) {
                    badge.classList.add('hidden');
                    progressText.classList.add('hidden');
                    progressBar.parentElement.classList.add('hidden');
                    prevBtn.classList.add('hidden');
                    nextBtn.classList.add('hidden');
                    html = `
                        <div class="text-center py-8 space-y-4">
                            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                                <i class="fa-solid fa-check-double text-2xl"></i>
                            </div>
                            <h2 class="text-2xl font-black text-slate-800">
                                Berhasil Dikirim!
                            </h2>
                            <p class="text-sm text-slate-600 max-w-sm mx-auto leading-relaxed">
                                Jazakumullah Khairan, <span class="font-bold text-slate-800">${formData.nama}</span>. Tanggapan Anda telah tercatat dengan aman pada pangkalan data kami.
                            </p>
                            <div class="pt-6">
                                <button type="button" onclick="resetForm()" class="px-5 py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 text-sm font-bold rounded-xl transition shadow-sm">
                                    <i class="fa-solid fa-redo mr-2"></i> Isi Survei Baru
                                </button>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
                
                // Switch transitions
                container.classList.remove('slide-out');
                container.classList.add('slide-in');
            }, 300);
        }
        // Save form inputs of current card to Javascript State
        function saveStepData() {
            if (currentStep === steps.WELCOME) {
                formData.nama = document.getElementById('input_nama').value.trim();
                formData.asal_sekolah = document.getElementById('input_sekolah').value.trim();
                formData.kelas = document.getElementById('input_kelas').value;
            } else if (currentStep === steps.SEC1_Q1) {
                formData.sec1_q1 = document.getElementById('input_sec1_q1').value.trim();
            } else if (currentStep === steps.SEC1_Q2) {
                formData.sec1_q2 = document.getElementById('input_sec1_q2').value.trim();
            } else if (currentStep === steps.SEC1_Q3) {
                formData.sec1_q3 = document.getElementById('input_sec1_q3').value.trim();
            } else if (currentStep === steps.SEC1_Q4) {
                formData.sec1_q4 = document.getElementById('input_sec1_q4').value.trim();
            } else if (currentStep === steps.SEC1_Q5) {
                formData.sec1_q5 = cleanCurrencyValue(document.getElementById('input_sec1_q5').value);
            } else if (currentStep === steps.SEC2_Q1) {
                formData.sec2_q1 = document.getElementById('input_sec2_q1').value.trim();
            } else if (currentStep === steps.SEC2_Q2) {
                formData.sec2_q2 = document.getElementById('input_sec2_q2').value.trim();
            } else if (currentStep === steps.SEC2_Q3) {
                formData.sec2_q3 = document.getElementById('input_sec2_q3').value.trim();
            } else if (currentStep === steps.SEC2_Q4) {
                formData.sec2_q4 = cleanCurrencyValue(document.getElementById('input_sec2_q4').value);
            } else if (currentStep === steps.SEC2_Q5) {
                formData.sec2_q5 = document.getElementById('input_sec2_q5').value.trim();
            } else if (currentStep === steps.SEC2_Q6) {
                formData.sec2_q6 = cleanCurrencyValue(document.getElementById('input_sec2_q6').value);
            }
        }
        // Validate details to ensure zero blank responses on validation steps
        function validateStep() {
            saveStepData();
            if (currentStep === steps.WELCOME) {
                if (!formData.nama) { showError("Silakan isi nama lengkap Anda."); return false; }
                if (!formData.asal_sekolah) { showError("Silakan isi asal sekolah Anda."); return false; }
                if (!formData.kelas) { showError("Silakan pilih kelas Anda."); return false; }
            } else if (currentStep === steps.SEC1_Q1 && !formData.sec1_q1) {
                showError("Jawaban atau pendapat Anda wajib diisi."); return false;
            } else if (currentStep === steps.SEC1_Q2 && !formData.sec1_q2) {
                showError("Pendapat Anda mengenai biaya dakwah Al-Kahfi wajib diisi."); return false;
            } else if (currentStep === steps.SEC1_Q3 && !formData.sec1_q3) {
                showError("Silakan isi jawaban singkat Anda."); return false;
            } else if (currentStep === steps.SEC1_Q4 && !formData.sec1_q4) {
                showError("Berikan jawaban apakah Anda berkenan berkontribusi."); return false;
            } else if (currentStep === steps.SEC1_Q5 && formData.sec1_q5 === "") {
                showError("Silakan isi nominal kontribusi Anda (isi 0 jika tidak bisa)."); return false;
            } else if (currentStep === steps.SEC2_Q1 && !formData.sec2_q1) {
                showError("Wajib memberikan jawaban."); return false;
            } else if (currentStep === steps.SEC2_Q2 && !formData.sec2_q2) {
                showError("Silakan tentukan keputusan ketertarikan mengoleksi Anda."); return false;
            } else if (currentStep === steps.SEC2_Q3 && !formData.sec2_q3) {
                showError("Berikan jawaban perihal kerelaan infak buletin."); return false;
            } else if (currentStep === steps.SEC2_Q4 && formData.sec2_q4 === "") {
                showError("Silakan isi nominal infak buletin Anda (isi 0 jika tidak bisa)."); return false;
            } else if (currentStep === steps.SEC2_Q5 && !formData.sec2_q5) {
                showError("Silakan tentukan jawaban apakah Anda tertarik membeli buku kompilasi."); return false;
            } else if (currentStep === steps.SEC2_Q6 && formData.sec2_q6 === "") {
                showError("Silakan isi ekspektasi nominal harga buku kompilasi (isi 0 jika tidak bisa)."); return false;
            }
            return true;
        }
        // Button Click handlers
        function handleNext() {
            if (currentStep === steps.CONFIRM) {
                submitFinalData();
                return;
            }
            if (validateStep()) {
                currentStep++;
                renderCard();
            }
        }
        // Handle Back / Prev transitions
        function handlePrev() {
            if (currentStep > steps.WELCOME) {
                saveStepData();
                currentStep--;
                renderCard();
            }
        }
        // Helper: Format to IDR presentation
        function formatToIDR(rawVal) {
            if (!rawVal) return "";
            return new Intl.NumberFormat("id-ID").format(rawVal);
        }
        // Helper: Strip non-numeric for storage
        function cleanCurrencyValue(displayVal) {
            return displayVal.toString().replace(/\D/g, "");
        }
        // Text input event handler for dynamic Rupiah typing
        function onCurrencyInput(element) {
            let clean = cleanCurrencyValue(element.value);
            if (clean) {
                element.value = formatToIDR(clean);
            } else {
                element.value = "";
            }
        }
        // Auto Quick Fill features for buttons
        function setQuickInput(elementId, value) {
            const input = document.getElementById(elementId);
            if (input) {
                input.value = value;
                // Auto trigger focus to make it organic
                input.focus();
            }
        }
        function setCurrencyValue(elementId, value) {
            const input = document.getElementById(elementId);
            if (input) {
                input.value = formatToIDR(value);
                input.focus();
            }
        }
        // Beautiful Dynamic Dialog Modal Trigger
        function showError(message) {
            const modal = document.getElementById('customAlert');
            document.getElementById('alertMessage').innerText = message;
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.firstElementChild.classList.remove('scale-95');
            modal.firstElementChild.classList.add('scale-100');
        }
        function closeAlert() {
            const modal = document.getElementById('customAlert');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-95');
        }
        // Reset application states
        function resetForm() {
            currentStep = steps.WELCOME;
            Object.keys(formData).forEach(key => formData[key] = '');
            
            // Re-display sections
            document.getElementById('sectionBadge').classList.remove('hidden');
            document.getElementById('stepProgressText').classList.remove('hidden');
            document.getElementById('progressBar').parentElement.classList.remove('hidden');
            document.getElementById('prevBtn').classList.remove('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
            renderCard();
        }
        // Submitting data directly via Google Apps Script integration hooks
        function submitFinalData() {
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');
            
            // Show dynamic loading states on UI
            nextBtn.disabled = true;
            prevBtn.disabled = true;
            nextBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Mengirim...`;
            // Detect Google Apps Script execution context
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function() {
                        currentStep = steps.SUCCESS;
                        renderCard();
                    })
                    .withFailureHandler(function(error) {
                        showError("Gagal mengirim data: " + error.message);
                        nextBtn.disabled = false;
                        prevBtn.disabled = false;
                        nextBtn.innerHTML = `Kirim Jawaban <i class="fa-solid fa-paper-plane"></i>`;
                    })
                    .submitForm(formData);
            } else {
                // Mock execution fallback for browsers/standalone previews
                console.log("Mocking Google Apps Script submit payload:", formData);
                setTimeout(() => {
                    currentStep = steps.SUCCESS;
                    renderCard();
                }, 1500);
            }
        }
        // Window load initial rendering
        window.onload = function() {
            renderCard();
        };
    </script>
</body>
</html>
